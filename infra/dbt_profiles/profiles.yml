dbt_stocks:
  outputs:

    # ── Local Postgres (host machine) ─────────────────────────
    dev:
      type: postgres
      host: "{{ env_var('PG_HOST_LOCAL') }}"
      port: "{{ env_var('PG_PORT_LOCAL') | int }}"
      dbname: "{{ env_var('PG_DB_LOCAL') }}"
      user: "{{ env_var('PG_USER_LOCAL') }}"
      password: "{{ env_var('PG_PASSWORD_LOCAL') }}"
      schema: "{{ env_var('PG_SCHEMA_LOCAL') }}"
      threads: 4

    # ── Docker Postgres (Airflow container) ───────────────────
    docker:
      type: postgres
      host: "{{ env_var('PG_HOST') }}"
      port: "{{ env_var('PG_PORT') | int }}"
      dbname: "{{ env_var('PG_DB') }}"
      user: "{{ env_var('PG_USER') }}"
      password: "{{ env_var('PG_PASSWORD') }}"
      schema: "{{ env_var('PG_SCHEMA') }}"
      threads: 4

  target: dev
